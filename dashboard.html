<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Student Finance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <h2>Student Finance</h2>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="transactions.html">Гүйлгээнүүд</a>
    <a href="#" onclick="logoutUser()">Холбоос таслах</a>
  </div>

  <div class="main-content">
    <h1>Тавтай морил, <span id="userName">...</span></h1>
    <p id="guestNotice" hidden style="padding: 12px; background: #fff7ed; border-radius: 8px;">
      Зочны горим: энэ горимд гүйлгээ болон бусад мэдээлэл хадгалагдахгүй.
    </p>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
      <div class="card" style="flex: 1;">
        <h3>Нийт үлдэгдэл</h3>
        <p id="totalBalance" style="font-size: 24px;">$0.00</p>
      </div>
      <div class="card" style="flex: 1;">
        <h3>Орлого</h3>
        <p id="totalIncome" class="income" style="font-size: 24px;">$0.00</p>
      </div>
      <div class="card" style="flex: 1;">
        <h3>Зарлага</h3>
        <p id="totalExpense" class="expense" style="font-size: 24px;">$0.00</p>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h3>Сүүлийн гүйлгээнүүд</h3>
      <div id="recentTransactions"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
